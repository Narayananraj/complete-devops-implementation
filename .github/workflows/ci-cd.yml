
# Stages:
#   0. Secrets Scan             (Gitleaks)
#   1. Build & Unit Test        (go build + go test)
#   2. Code Quality             (golangci-lint)
#   3. SAST                     (gosec — Go-native security static analysis)
#   4. SCA                      (govulncheck + Trivy fs mode on go.sum)
#   5. License Compliance       (Trivy license scan)
#   6. Dockerfile Lint          (Hadolint)
#   7. IaC Scan                 (Checkov + Trivy config on Helm chart + k8s/)
#   8. Build & Push Image       (Docker Buildx -> Docker Hub)
#   9. SBOM Generation          (Syft)
#  10. Container Image Scan     (Trivy — scans the PUSHED image)
#  11. Image Signing            (Cosign keyless / OIDC)
#  12. Attestation              (Cosign attest — SBOM predicate)
#  13. Update Helm Chart Tag    (GitOps commit — ArgoCD picks this up)
# ==============================================================================
 
name: CI - DevSecOps Pipeline
 
on:
  push:
    branches: [main]
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'
 
permissions:
  contents: read
 
env:
  GO_VERSION: "1.25"
  IMAGE_NAME: go-web-app
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app
 
jobs:
 
  # ============================================================================
  # STAGE 0: SECRETS SCAN — must run before anything touches the code further
  # Tool: Gitleaks | Alternatives: TruffleHog, GitGuardian
  # ============================================================================
  
  secrets-scan:
    name: "Secrets Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

  # ============================================================================
  # STAGE 1: BUILD & UNIT TEST
  # ============================================================================
  
  build-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not gofmt-formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o go-web-app

      - name: Test with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30 

  # ============================================================================
  # STAGE 2: CODE QUALITY / LINT
  # Tool: golangci-lint (aggregates govet, staticcheck, errcheck, etc.)
  # ============================================================================
  
  code-quality:
    name: "Code Quality (golangci-lint)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
 
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m 

  # ============================================================================
  # STAGE 3: SAST — Static Application Security Testing (Go-specific)
  # Tool: gosec (official Go security scanner) | Alternative: Semgrep p/golang
  # ============================================================================ 

  sast:
    name: "SAST (gosec)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    permissions:
      contents: read
      security-events: write   # to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
 
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec-results.sarif -severity medium -confidence medium ./...'
 
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif 

  # ============================================================================
  # STAGE 4: SCA — Software Composition Analysis (Go module dependencies)
  # Tools: govulncheck (official Go vuln DB, source-aware) + Trivy fs mode
  # Alternatives: Snyk Open Source, OWASP Dependency-Check
  # ============================================================================ 
  
  sca:
    name: "📦 SCA (Dependency Scan)"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
 
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
 
      - name: Run govulncheck
        run: govulncheck ./...
        # Source-aware: only flags vulns actually reachable in your call graph
        # -> fewer false positives than a plain go.sum CVE match
 
      - name: Trivy filesystem scan (go.sum)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true  
  
  # ============================================================================
  # STAGE 5: LICENSE COMPLIANCE
  # Tool: Trivy license scanner
  # ============================================================================
  license-scan:
    name: "📜 License Compliance"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
 
      - name: Trivy license scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "license"
          format: "table"
          severity: "CRITICAL,HIGH"
   