
# Stages:
#   0. Secrets Scan             (Gitleaks)
#   1. Build & Unit Test        (go build + go test)
#   2. Code Quality             (golangci-lint)
#   3. SAST                     (gosec — Go-native security static analysis)
#   4. SCA                      (govulncheck + Trivy fs mode on go.sum)
#   5. License Compliance       (Trivy license scan)
#   6. Dockerfile Lint          (Hadolint)
#   7. IaC Scan                 (Checkov + Trivy config on Helm chart + k8s/)
#   8. Build & Push Image       (Docker Buildx -> Docker Hub)
#   9. SBOM Generation          (Syft)
#  10. Container Image Scan     (Trivy — scans the PUSHED image)
#  11. Image Signing            (Cosign keyless / OIDC)
#  12. Attestation              (Cosign attest — SBOM predicate)
#  13. Update Helm Chart Tag    (GitOps commit — ArgoCD picks this up)
# ==============================================================================
 
name: CI - DevSecOps Pipeline
 
on:
  push:
    branches: [main]
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'
 
permissions:
  contents: read
 
env:
  GO_VERSION: "1.25"
  IMAGE_NAME: go-web-app
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app
 
jobs:
 
  # ============================================================================
  # STAGE 0: SECRETS SCAN — must run before anything touches the code further
  # Tool: Gitleaks | Alternatives: TruffleHog, GitGuardian
  # ============================================================================
  
  secrets-scan:
    name: "Secrets Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

  # ============================================================================
  # STAGE 1: BUILD & UNIT TEST
  # ============================================================================
  
  build-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not gofmt-formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o go-web-app

      - name: Test with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30 

  # ============================================================================
  # STAGE 2: CODE QUALITY / LINT
  # Tool: golangci-lint (aggregates govet, staticcheck, errcheck, etc.)
  # ============================================================================
  
  code-quality:
    name: "Code Quality (golangci-lint)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
 
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m 

  # ============================================================================
  # STAGE 3: SAST — Static Application Security Testing (Go-specific)
  # Tool: gosec (official Go security scanner) | Alternative: Semgrep p/golang
  # ============================================================================ 

  sast:
    name: "SAST (gosec)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    permissions:
      contents: read
      security-events: write   # to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
 
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec-results.sarif -severity medium -confidence medium ./...'
 
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif 

  # ============================================================================
  # STAGE 4: SCA — Software Composition Analysis (Go module dependencies)
  # Tools: govulncheck (official Go vuln DB, source-aware) + Trivy fs mode
  # Alternatives: Snyk Open Source, OWASP Dependency-Check
  # ============================================================================ 
  
  sca:
    name: "SCA (Dependency Scan)"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
 
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
 
      - name: Run govulncheck
        run: govulncheck ./...
        # Source-aware: only flags vulns actually reachable in your call graph
        # -> fewer false positives than a plain go.sum CVE match
 
      - name: Trivy filesystem scan (go.sum)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true  
  
  # ============================================================================
  # STAGE 5: LICENSE COMPLIANCE
  # Tool: Trivy license scanner
  # ============================================================================ 

  license-scan:
    name: "License Compliance"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
 
      - name: Trivy license scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "license"
          format: "table"
          severity: "CRITICAL,HIGH"
   
  # ============================================================================
  # STAGE 6: DOCKERFILE LINT
  # Tool: Hadolint
  # ============================================================================

  dockerfile-lint:
    name: "Dockerfile Lint"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
 
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning 

  # ============================================================================
  # STAGE 7: IaC SCAN — Helm chart + raw k8s manifests + ingress config
  # Tools: Checkov + Trivy config mode
  # ============================================================================

  iac-scan:
    name: "IaC Scan (Helm + K8s)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
 
      - name: Checkov - Helm chart
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: helm/go-web-app-chart
          framework: helm
          soft_fail: false
          output_format: cli
 
      - name: Checkov - raw K8s manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/manifests
          framework: kubernetes
          soft_fail: false
          output_format: cli
 
      - name: Trivy config scan (Helm + K8s + Dockerfile + ingress)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"  
 
  # ============================================================================
  # STAGE 8: BUILD & PUSH IMAGE
  # ============================================================================

  build-push:
    name: "Build & Push Image"
    runs-on: ubuntu-latest
    needs: [code-quality, sast, sca, license-scan, dockerfile-lint, iac-scan]
    permissions:
      contents: read
      id-token: write   # required for Cosign keyless signing later
    steps:
      - uses: actions/checkout@v4
 
      - uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.DOCKERHUB_IMAGE }}:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true 

  # ============================================================================
  # STAGE 9: SBOM GENERATION (standalone artifact for audit trail)
  # Tool: Syft
  # ============================================================================

  sbom:
    name: "Generate SBOM"
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.DOCKERHUB_IMAGE }}:${{ github.run_id }}"
          format: cyclonedx-json
          output-file: "go-web-app-sbom.cyclonedx.json"
 
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-web-app-sbom
          path: go-web-app-sbom.cyclonedx.json
          retention-days: 90 

  # ============================================================================
  # STAGE 10: CONTAINER IMAGE VULNERABILITY SCAN (on the PUSHED image)
  # Tool: Trivy image mode
  # ============================================================================ 

  image-scan:
    name: "Image Scan"
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Trivy scan of pushed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKERHUB_IMAGE }}:${{ github.run_id }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true 

  # ============================================================================
  # STAGE 11: IMAGE SIGNING (Supply Chain Integrity)
  # Tool: Cosign — keyless signing via GitHub OIDC
  # ============================================================================ 

  sign-image:
    name: "Sign Image"
    runs-on: ubuntu-latest
    needs: image-scan
    permissions:
      contents: read
      id-token: write   # this is what lets GitHub Actions itself act as the OIDC identity
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign image (keyless)
        run: |
          cosign sign --yes "${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}"

  # ============================================================================
  # STAGE 12: ATTESTATION — attach SBOM as verifiable metadata
  # ============================================================================

  attest:
    name: "Attest SBOM"
    runs-on: ubuntu-latest
    needs: [sbom, sign-image]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
 
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: go-web-app-sbom
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Attach SBOM attestation
        run: |
          cosign attest --yes \
            --predicate "go-web-app-sbom.cyclonedx.json" \
            --type cyclonedx \
            "${{ env.DOCKERHUB_IMAGE }}:${{ github.run_id }}"
 
  # ============================================================================
  # STAGE 13: UPDATE HELM CHART TAG (GitOps trigger — ArgoCD watches this repo)
  # Replaces original's raw sed-on-values.yaml job; kept the same mechanism,
  # just now gated behind every security stage above instead of running
  # straight after build+push.
  # ============================================================================ 

  update-helm-tag:
    name: "Update Helm Chart Tag"
    runs-on: ubuntu-latest
    needs: attest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
 
      - name: Update image tag in Helm values
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/go-web-app-chart/values.yaml
 
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/go-web-app-chart/values.yaml
          git diff --cached --quiet || git commit -m "ci: update image tag to ${{ github.run_id }} [skip ci]"
          git push
 